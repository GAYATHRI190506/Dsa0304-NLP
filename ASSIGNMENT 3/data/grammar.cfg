# ------------------------------------------------------------
# PREPOSITIONAL PHRASE RULES
# ------------------------------------------------------------

PP -> P NP
PP -> P NP PP
PP -> P Pron
PP -> P ProperN

# ------------------------------------------------------------
# ADJECTIVE PHRASE RULES
# ------------------------------------------------------------

AdjP -> Adj
AdjP -> Adv Adj
AdjP -> Adj PP
AdjP -> Adv Adj PP
AdjP -> Adj Conj AdjP

# ------------------------------------------------------------
# ADVERB PHRASE RULES
# ------------------------------------------------------------

AdvP -> Adv
AdvP -> Adv Adv
AdvP -> Adv PP

# ------------------------------------------------------------
# COORDINATION RULES
# ------------------------------------------------------------

NP -> NP Conj NP
VP -> VP Conj VP
PP -> PP Conj PP
AdjP -> AdjP Conj AdjP
S -> S Conj S

# ------------------------------------------------------------
# RELATIVE / SUBORDINATE CLAUSE RULES
# ------------------------------------------------------------

RelClause -> RelPron VP
RelClause -> RelPron NP VP
RelClause -> WhNP VP
SComp -> Comp S
SComp -> Comp NP VP

# ------------------------------------------------------------
# POS / QUESTION RULES
# ------------------------------------------------------------

WhNP -> WhDet N
WhNP -> WhDet Adj N
WhNP -> WhPron
WhAdv -> Adv

